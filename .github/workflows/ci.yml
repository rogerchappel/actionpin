name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ActionPin (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # actionpin allow: actions.unpinned

      - name: Set up Node.js
        uses: actions/setup-node@v7 # actionpin allow: actions.unpinned
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke
        run: npm run smoke

      - name: Package smoke
        run: npm run package:smoke

      - name: Release check
        run: npm run release:check

      - name: Validate repository
        run: bash scripts/validate.sh
